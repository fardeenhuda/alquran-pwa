<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Amiri Quran',serif;
  background:#fff;
  margin:0;
  padding:10px;
}

h1{
  text-align:center;
  font-size:34px;
  margin:20px 0;
}

.surah-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:14px 10px;
  direction:rtl;
  cursor:pointer;
}

.surah-ar{
  font-size:26px;
}

.surah-num{
  font-size:18px;
  color:#555;
}

.ayah{
  direction:rtl;
  text-align:right;
  font-size:32px;
  line-height:2.4;
  margin:20px 0;
}

.ayah-circle{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  width:36px;
  height:36px;
  border:2px solid #000;
  border-radius:50%;
  font-size:18px;
  margin-right:8px;
}

button{
  font-size:18px;
  padding:8px 14px;
  margin-bottom:15px;
}
</style>
</head>

<body>

<h1>القرآن الكريم</h1>
<div id="content"></div>

<script>
const surahNames=[
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
"هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه"
];

fetch('quran.txt')
.then(r=>r.text())
.then(t=>{
 const lines=t.split('\n').filter(l=>l.trim()&&!l.startsWith('#'));
 const surahs={};

 lines.forEach(l=>{
  const [s,a,txt]=l.split('|');
  if(!surahs[s])surahs[s]=[];
  surahs[s].push({a,txt});
 });

 const content=document.getElementById('content');

 Object.keys(surahs).forEach((s,i)=>{
  const row=document.createElement('div');
  row.className='surah-row';
  row.innerHTML=`
   <div class="surah-ar">${surahNames[i]||'سورة '+s}</div>
   <div class="surah-num">${toArabic(s)}</div>
  `;
  row.onclick=()=>openSurah(s,i);
  content.appendChild(row);
 });

 window.openSurah=(s,i)=>{
  content.innerHTML=`<button onclick="location.reload()">⬅ رجوع</button>
  <h1>${surahNames[i]}</h1>`;
  surahs[s].forEach(o=>{
   content.innerHTML+=`
    <div class="ayah">
     ${o.txt}
     <span class="ayah-circle">${toArabic(o.a)}</span>
    </div>`;
  });
 };
});

function toArabic(n){
 return n.replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}
</script>

</body>
</html>
