<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>القرآن الكريم</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: serif;
      margin: 0;
      padding: 16px;
      background: #fff;
      color: #000;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .surah-list div {
      padding: 16px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
      font-size: 20px;
    }
    .surah-list div:hover {
      background: #f3f3f3;
    }
    .hidden {
      display: none;
    }
    .ayah {
      font-size: 22px;
      line-height: 2;
      margin: 12px 0;
    }
    .back {
      margin-bottom: 16px;
      font-size: 18px;
      cursor: pointer;
      color: blue;
    }
  </style>
</head>
<body>

<h1>القرآن الكريم</h1>

<div id="list" class="surah-list"></div>

<div id="surahView" class="hidden">
  <div class="back" onclick="showList()">← رجوع</div>
  <div id="ayahs"></div>
</div>

<script>
let quranText = {};
let surahAyahs = {};

fetch("quran.txt")
  .then(r => r.text())
  .then(text => {
    const lines = text.split("\n");
    lines.forEach(line => {
      if (!line || line.startsWith("#")) return;
      const parts = line.split("|");
      const surah = parts[0];
      const ayah = parts[1];
      const textAyah = parts.slice(2).join("|");

      if (!surahAyahs[surah]) surahAyahs[surah] = [];
      surahAyahs[surah].push({ ayah, text: textAyah });
    });

    const list = document.getElementById("list");
    Object.keys(surahAyahs).forEach(surah => {
      const div = document.createElement("div");
      div.textContent = "سورة " + surah;
      div.onclick = () => openSurah(surah);
      list.appendChild(div);
    });
  });

function openSurah(num) {
  document.getElementById("list").classList.add("hidden");
  document.getElementById("surahView").classList.remove("hidden");

  const ayahsDiv = document.getElementById("ayahs");
  ayahsDiv.innerHTML = "";

  surahAyahs[num].forEach(a => {
    const p = document.createElement("div");
    p.className = "ayah";
    p.textContent = a.text;
    ayahsDiv.appendChild(p);
  });
}

function showList() {
  document.getElementById("surahView").classList.add("hidden");
  document.getElementById("list").classList.remove("hidden");
}
</script>

</body>
</html>
