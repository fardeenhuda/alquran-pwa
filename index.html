<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Amiri Quran',serif;
  background:#fff;
  margin:0;
  padding:20px;
  direction:rtl;
}

h1{
  text-align:center;
  font-size:36px;
  margin-bottom:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.surah-item{
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  font-size:22px;
  text-align:right;
}

.back-btn{
  display:block;
  margin:20px auto;
  padding:6px 14px;
  font-size:16px;
}

.ayah{
  font-size:28px;
  line-height:2.8;
  text-align:center;
}

.ayah-number{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  width:36px;
  height:36px;
  border:2px solid #000;
  border-radius:50%;
  font-size:18px;
  margin-right:8px;
}
</style>
</head>

<body>

<h1>القرآن الكريم</h1>
<div class="container" id="content">Loading…</div>

<script>
function toArabicNumber(num){
  return num.replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

fetch("quran.txt")
.then(r=>r.text())
.then(text=>{
  const lines=text.split("\n").filter(l=>l && !l.startsWith("#"));
  const surahs={};

  lines.forEach(l=>{
    const [s,a,t]=l.split("|");
    if(!surahs[s]) surahs[s]=[];
    surahs[s].push({a,t});
  });

  const content=document.getElementById("content");

  function list(){
    content.innerHTML="";
    Object.keys(surahs).forEach(s=>{
      const d=document.createElement("div");
      d.className="surah-item";
      d.innerText="سورة "+toArabicNumber(s);
      d.onclick=()=>open(s);
      content.appendChild(d);
    });
  }

  function open(s){
    content.innerHTML="";
    const b=document.createElement("button");
    b.className="back-btn";
    b.innerText="رجوع";
    b.onclick=list;
    content.appendChild(b);

    surahs[s].forEach(v=>{
      const d=document.createElement("div");
      d.className="ayah";
      d.innerHTML=`${v.t} <span class="ayah-number">${toArabicNumber(v.a)}</span>`;
      content.appendChild(d);
    });
  }

  list();
});
</script>

</body>
</html>
