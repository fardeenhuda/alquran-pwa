<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Al Quran</title>

<style>
body {
  font-family: Arial;
  margin: 0;
}

header {
  background: green;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 20px;
}

#container {
  display: flex;
  height: calc(100vh - 50px);
}

#surahs {
  width: 40%;
  border-right: 1px solid #ccc;
  overflow-y: auto;
}

#surahs div {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

#surahs div:hover {
  background: #f2f2f2;
}

#ayahs {
  width: 60%;
  padding: 20px;
  direction: rtl;
  font-size: 26px;
  line-height: 2.2;
  overflow-y: auto;
}
</style>
</head>

<body>

<header>Al Qur'an (114 Surah)</header>

<div id="container">
  <div id="surahs"></div>
  <div id="ayahs">Surah select karo</div>
</div>

<script>
const surahs = [
  "Al-Fatihah","Al-Baqarah","Aal-E-Imran","An-Nisa","Al-Ma'idah","Al-An'am",
  "Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim",
  "Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Taha",
  "...",
  "An-Nas"
];

const ayahs = {
  0: ["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ"],
  1: ["الم","ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ"]
};

const surahBox = document.getElementById("surahs");
const ayahBox = document.getElementById("ayahs");

surahs.forEach((name, i) => {
  const d = document.createElement("div");
  d.innerText = (i+1) + ". " + name;
  d.onclick = () => {
    ayahBox.innerHTML = "";
    (ayahs[i] || ["Text abhi add nahi hai"]).forEach(a => {
      const p = document.createElement("p");
      p.innerText = a;
      ayahBox.appendChild(p);
    });
  };
  surahBox.appendChild(d);
});
</script>

</body>
</html>
