<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Al Quran</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: serif;
      background: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .surah {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      font-size: 22px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>القرآن الكريم</h1>

<div class="surah" onclick="openSurah('fatiha')">سورة الفاتحة</div>
<div class="surah" onclick="openSurah('sajdah')">سورة السجدة</div>

<script>
function openSurah(name) {
  if (name === 'fatiha') {
    document.body.innerHTML = `
      <h1>سورة الفاتحة</h1>
      <p>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <p>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</p>
      <p>الرَّحْمَٰنِ الرَّحِيمِ</p>
      <p>مَالِكِ يَوْمِ الدِّينِ</p>
      <p>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</p>
      <p>اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ</p>
      <p>صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ</p>
    `;
  }
}
</script>

</body>
</html>
