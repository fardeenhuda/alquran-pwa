<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>القرآن الكريم</title>

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Amiri Quran', serif;
      background: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
    }

    .surah-list div {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
      text-align: right;
      font-size: 22px;
    }

    .ayah {
      direction: rtl;
      text-align: right;
      font-size: 32px;
      line-height: 2.4;
      margin: 20px 0;
    }

    .ayah-circle {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 36px;
      height: 36px;
      border: 2px solid #000;
      border-radius: 50%;
      font-size: 18px;
      margin-right: 10px;
    }

    button {
      margin: 20px 0;
      padding: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>القرآن الكريم</h1>

<div id="content"></div>

<script>
fetch('quran.txt')
  .then(res => res.text())
  .then(text => {
    const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
    const surahs = {};

    lines.forEach(line => {
      const [s,a,ayah] = line.split('|');
      if (!surahs[s]) surahs[s] = [];
      surahs[s].push({a, ayah});
    });

    const content = document.getElementById('content');
    const list = document.createElement('div');
    list.className = 'surah-list';

    Object.keys(surahs).forEach(s => {
      const d = document.createElement('div');
      d.textContent = 'سورة ' + s;
      d.onclick = () => openSurah(s);
      list.appendChild(d);
    });

    content.appendChild(list);

    window.openSurah = function(s) {
      content.innerHTML = '<button onclick="location.reload()">⬅ Back</button>';
      surahs[s].forEach(o => {
        content.innerHTML += `
          <div class="ayah">
            ${o.ayah}
            <span class="ayah-circle">${toArabic(o.a)}</span>
          </div>`;
      });
    };
  });

function toArabic(n) {
  return n.replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}
</script>

</body>
</html>
