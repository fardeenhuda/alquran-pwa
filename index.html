<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body{
  font-family: 'Amiri Quran', serif;
  background:#fff;
  margin:0;
  padding:20px;
  direction:rtl;
  text-align:right;
}

h1{
  text-align:center;
  font-size:34px;
  margin-bottom:20px;
}

.surah-item{
  padding:14px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
  font-size:22px;
}

.surah-item:hover{
  background:#f5f5f5;
}

.back-btn{
  margin-bottom:20px;
  padding:6px 12px;
  font-size:16px;
}

.ayah{
  font-size:26px;
  line-height:2.6;
  margin-bottom:10px;
}

.ayah-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border:2px solid #000;
  border-radius:50%;
  font-size:16px;
  margin-left:8px;
}
</style>
</head>

<body>

<h1>القرآن الكريم</h1>
<div id="content">Loading...</div>

<script>
fetch("quran.txt")
.then(res => res.text())
.then(text => {

  const lines = text.split("\n").filter(l => l && !l.startsWith("#"));
  const surahs = {};

  lines.forEach(line=>{
    const [s,a,ayah] = line.split("|");
    if(!surahs[s]) surahs[s]=[];
    surahs[s].push({a,ayah});
  });

  const content = document.getElementById("content");

  function showSurahList(){
    content.innerHTML="";
    Object.keys(surahs).forEach(s=>{
      const div=document.createElement("div");
      div.className="surah-item";
      div.innerText="سورة "+s;
      div.onclick=()=>showSurah(s);
      content.appendChild(div);
    });
  }

  function showSurah(s){
    content.innerHTML="";
    const back=document.createElement("button");
    back.innerText="← Back";
    back.className="back-btn";
    back.onclick=showSurahList;
    content.appendChild(back);

    surahs[s].forEach(v=>{
      const d=document.createElement("div");
      d.className="ayah";
      d.innerHTML=`${v.ayah} <span class="ayah-number">${v.a}</span>`;
      content.appendChild(d);
    });
  }

  showSurahList();
});
</script>

</body>
</html>
