<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Amiri Quran',serif;
  margin:0;
  background:#fff;
  direction:rtl;
}

header{
  text-align:center;
  font-size:34px;
  padding:20px 10px;
}

#app{
  max-width:900px;
  margin:auto;
  padding:0 16px 40px;
}

/* Surah list */
.surah{
  padding:14px 6px;
  border-bottom:1px solid #eee;
  font-size:22px;
  cursor:pointer;
}

/* Back button */
.back{
  position:fixed;
  top:12px;
  left:12px;
  font-size:14px;
  padding:6px 12px;
  z-index:10;
}

/* Ayah view */
.ayah{
  font-size:30px;
  line-height:2.4;
  margin-bottom:12px;
  text-align:justify;
}

.ayah span{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  width:34px;
  height:34px;
  border:2px solid #000;
  border-radius:50%;
  font-size:17px;
  margin-right:6px;
  white-space:nowrap;
}
</style>
</head>

<body>

<header>القرآن الكريم</header>
<div id="app">Loading…</div>

<script>
function arNum(n){
  return n.replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

fetch("quran.txt")
.then(r=>r.text())
.then(t=>{
  const lines=t.split("\n").filter(l=>l && !l.startsWith("#"));
  const s={};

  lines.forEach(l=>{
    const [sn,an,tx]=l.split("|");
    if(!s[sn]) s[sn]=[];
    s[sn].push({an,tx});
  });

  const app=document.getElementById("app");

  function list(){
    app.innerHTML="";
    Object.keys(s).forEach(n=>{
      const d=document.createElement("div");
      d.className="surah";
      d.textContent="سورة "+arNum(n);
      d.onclick=()=>open(n);
      app.appendChild(d);
    });
    window.scrollTo(0,0);
  }

  function open(n){
    app.innerHTML="";
    const b=document.createElement("button");
    b.className="back";
    b.textContent="← رجوع";
    b.onclick=list;
    document.body.appendChild(b);

    s[n].forEach(v=>{
      const d=document.createElement("div");
      d.className="ayah";
      d.innerHTML=`${v.tx} <span>${arNum(v.an)}</span>`;
      app.appendChild(d);
    });

    window.scrollTo({top:0,behavior:"smooth"});
  }

  list();
});
</script>

</body>
</html>
