<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Amiri Quran', serif;
  margin: 0;
  background: #fff;
}

header {
  background: #1e9e5a;
  color: white;
  text-align: center;
  padding: 12px;
  font-size: 22px;
}

.surah {
  display: grid;
  grid-template-columns: 40px 1fr 1fr;
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.num {
  color: #666;
}

.en {
  text-align: left;
}

.ar {
  text-align: right;
  direction: rtl;
}
</style>
</head>

<body>
<header>القرآن الكريم</header>
<div id="list"></div>

<script>
const surahs = [
["Al-Fātiḥah","الفاتحة"],["Al-Baqarah","البقرة"],["Āl-ʿImrān","آل عمران"],
["An-Nisā’","النساء"],["Al-Mā’idah","المائدة"],["Al-Anʿām","الأنعام"],

["Yūnus","يونس"],["Hūd","هود"],["Yūsuf","يوسف"],["Ar-Raʿd","الرعد"],
["Ibrāhīm","إبراهيم"],["Al-Ḥijr","الحجر"],["An-Naḥl","النحل"],
["Al-Isrā’","الإسراء"],["Al-Kahf","الكهف"],["Maryam","مريم"],
["Ṭā-Hā","طه"],["Al-Anbiyā’","الأنبياء"],["Al-Ḥajj","الحج"],
["Al-Mu’minūn","المؤمنون"],["An-Nūr","النور"],["Al-Furqān","الفرقان"],
["Ash-Shuʿarā’","الشعراء"],["An-Naml","النمل"],["Al-Qaṣaṣ","القصص"],
["Al-ʿAnkabūt","العنكبوت"],["Ar-Rūm","الروم"],["Luqmān","لقمان"],
["As-Sajdah","السجدة"],["Al-Aḥzāb","الأحزاب"],["Saba’","سبأ"],
["Fāṭir","فاطر"],["Yā-Sīn","يس"],["Aṣ-Ṣāffāt","الصافات"],
["Ṣād","ص"],["Az-Zumar","الزمر"],["Ghāfir","غافر"],
["Fuṣṣilat","فصلت"],["Ash-Shūrā","الشورى"],["Az-Zukhruf","الزخرف"],
["Ad-Dukhān","الدخان"],["Al-Jāthiyah","الجاثية"],["Al-Aḥqāf","الأحقاف"],
["Muḥammad","محمد"],["Al-Fatḥ","الفتح"],["Al-Ḥujurāt","الحجرات"],
["Qāf","ق"],["Adh-Dhāriyāt","الذاريات"],["Aṭ-Ṭūr","الطور"],
["An-Najm","النجم"],["Al-Qamar","القمر"],["Ar-Raḥmān","الرحمن"],
["Al-Wāqiʿah","الواقعة"],["Al-Ḥadīd","الحديد"],["Al-Mujādilah","المجادلة"],
["Al-Ḥashr","الحشر"],["Al-Mumtaḥanah","الممتحنة"],["Aṣ-Ṣaff","الصف"],
["Al-Jumuʿah","الجمعة"],["Al-Munāfiqūn","المنافقون"],["At-Taghābun","التغابن"],
["Aṭ-Ṭalāq","الطلاق"],["At-Taḥrīm","التحريم"],["Al-Mulk","الملك"],
["Al-Qalam","القلم"],["Al-Ḥāqqah","الحاقة"],["Al-Maʿārij","المعارج"],
["Nūḥ","نوح"],["Al-Jinn","الجن"],["Al-Muzzammil","المزمل"],

["Al-Fajr","الفجر"],["Al-Balad","البلد"],["Ash-Shams","الشمس"],
["Al-Layl","الليل"],["Aḍ-Ḍuḥā","الضحى"],["Ash-Sharḥ","الشرح"],
["At-Tīn","التين"],["Al-ʿAlaq","العلق"],["Al-Qadr","القدر"],
["Al-Bayyinah","البينة"],["Az-Zalzalah","الزلزلة"],["Al-ʿĀdiyāt","العاديات"],

["Al-Falaq","الفلق"],["An-Nās","الناس"]
];

const list = document.getElementById("list");

surahs.forEach((s,i)=>{
  list.innerHTML += `
    <div class="surah" onclick="location.href='surah.html?no=${i+1}&name=${s[1]}'">
      <div class="num">${i+1}</div>
      <div class="en">${s[0]}</div>
      <div class="ar">${s[1]}</div>
    </div>`;
});
</script>
</body>
</html>
