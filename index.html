<script>
fetch("quran.txt")
.then(r=>r.text())
.then(text=>{
  const lines=text.split("\n");
  const quran=document.getElementById("quran");
  const list=document.getElementById("surahList");

  let surahData={};

  for(let line of lines){
    if(line.startsWith("# PLEASE DO NOT REMOVE")) break;
    if(!line.trim()) continue;

    const p=line.split("|");
    if(p.length<3) continue;

    const s=p[0], a=p[1], t=p[2];

    if(!surahData[s]) surahData[s]=[];
    surahData[s].push({a,t});
  }

  // Surah List
  Object.keys(surahData).forEach(s=>{
    const div=document.createElement("div");
    div.className="surah";
    div.textContent="سورة "+s;
    div.onclick=()=>openSurah(s);
    list.appendChild(div);
  });

  function openSurah(s){
    list.style.display="none";
    quran.innerHTML="";

    const back=document.createElement("div");
    back.className="surah";
    back.textContent="⬅ الرجوع إلى القائمة";
    back.onclick=()=>{
      quran.innerHTML="";
      list.style.display="block";
    };
    quran.appendChild(back);

    surahData[s].forEach(v=>{
      const ay=document.createElement("div");
      ay.className="ayah";
      ay.innerHTML=`<span class="num">${s}|${v.a}</span> ${v.t}`;
      quran.appendChild(ay);
    });
  }
});
</script>
