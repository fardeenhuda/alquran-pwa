<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Al-Qur’an</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f9f9f9;
}

header {
  background: #0a8f5a;
  color: white;
  text-align: center;
  padding: 14px;
  font-size: 18px;
}

.surah-list {
  max-width: 900px;
  margin: auto;
}

.surah-row {
  display: grid;
  grid-template-columns: 40px 1fr 1fr;
  padding: 12px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
  background: white;
}

.surah-row:hover {
  background: #eefaf4;
}

.num {
  color: #666;
  font-size: 14px;
}

.eng {
  text-align: left;
}

.ar {
  font-family: 'Amiri', serif;
  font-size: 20px;
  text-align: right;
  direction: rtl;
}
</style>
</head>

<body>

<header>القرآن الكريم</header>

<div class="surah-list" id="list"></div>

const list = document.getElementById("list");

surahs.forEach((s, i) => {
  const row = document.createElement("div");
  row.className = "surah-row";
  row.innerHTML = `
    <div class="num">${i+1}</div>
    <div class="eng">${s[0]}</div>
    <div class="ar">${s[1]}</div>
  `;
  row.onclick = () => {
    window.location.href = "surah.html?no=" + (i+1);
  };
  list.appendChild(row);
});
</script>

</body>
</html>
