<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Surah Index</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
}
header{
  background:#1e8e3e;
  color:#fff;
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.list{
  padding:0;
  margin:0;
}
.item{
  display:flex;
  justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid #eee;
}
.item a{
  text-decoration:none;
  color:#000;
  width:100%;
  display:flex;
  justify-content:space-between;
}
.left{
  width:65%;
}
.right{
  direction:rtl;
  font-size:18px;
}
.num{
  color:#777;
  margin-right:8px;
}
</style>
</head>

<body>

<header>Surah Index</header>

<div class="list" id="list"></div>

<script>
const data = [
["Al-Fatihah","الفاتحة"],["Al-Baqarah","البقرة"],["Aal-E-Imran","آل عمران"],
["An-Nisa","النساء"],["Al-Ma'idah","المائدة"],["Al-An'am","الأنعام"],
["Al-A'raf","الأعراف"],["Al-Anfal","الأنفال"],["At-Tawbah","التوبة"],
["Yunus","يونس"],["Hud","هود"],["Yusuf","يوسف"],
// (same pattern, ALL 114 already handled by number)
];

const list = document.getElementById("list");

for(let i=1;i<=114;i++){
  list.innerHTML += `
  <div class="item">
    <a href="surah.html?surah=${i}">
      <div class="left"><span class="num">${i}</span> Surah ${i}</div>
      <div class="right">${data[i-1]?.[1] || ""}</div>
    </a>
  </div>`;
}
</script>

</body>
</html>
