<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>القرآن الكريم</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Scheherazade New", serif;
      background: #fff;
      color: #000;
      padding: 16px;
      line-height: 2;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
    .ayah {
      margin-bottom: 10px;
      font-size: 22px;
    }
  </style>
</head>
<body>

<h1>القرآن الكريم</h1>
<div id="content">Loading Quran...</div>

<script>
fetch("quran.txt")
  .then(res => res.text())
  .then(text => {
    const lines = text.split("\n");
    let html = "";
    lines.forEach(line => {
      if (line.trim() !== "") {
        html += `<div class="ayah">${line}</div>`;
      }
    });
    document.getElementById("content").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("content").innerText = "Error loading Quran text";
  });
</script>

</body>
</html>
