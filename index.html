<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surah Index</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
}
header {
  background: #1f9d55;
  color: white;
  text-align: center;
  padding: 12px;
  font-size: 20px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td {
  padding: 10px;
  border-bottom: 1px solid #eee;
}
td.num {
  width: 40px;
  color: #666;
}
td.eng {
  text-align: left;
}
td.ar {
  text-align: right;
  direction: rtl;
  font-family: "Amiri Quran", serif;
}
a {
  text-decoration: none;
  color: black;
  display: block;
}
</style>
</head>
<body>

<header>Surah Index</header>

<table>
<tbody id="surahList"></tbody>
</table>

<script>
const surahs = [
  ["Al-Fātiḥah","ٱلۡفَاتِحَةِ"],
  ["Al-Baqarah","ٱلۡبَقَرَةِ"],
  ["Āl-ʿImrān","اٰلِ عِمۡرٰن"],
  ["An-Nisā’","ٱلنِّسَآءِ"],
  ["Al-Mā’idah","ٱلۡمَائِدَةِ"],
  ["Al-Anʿām","ٱلۡأَنۡعَٰم"],
  ["Al-Aʿrāf","ٱلۡأَعۡرَاف"],
  ["Al-Anfāl","ٱلۡأَنفَال"],
  ["At-Tawbah","ٱلتَّوۡبَة"],
  ["Yūnus","يُونُس"],
  // 👉 aage yahin pattern pe 114 tak add hoga (next step me dunga)
];

const list = document.getElementById("surahList");
surahs.forEach((s,i)=>{
  list.innerHTML += `
  <tr>
    <td class="num">${i+1}</td>
    <td class="eng">
      <a href="surah.html?surah=${i+1}">${s[0]}</a>
    </td>
    <td class="ar">${s[1]}</td>
  </tr>`;
});
</script>

</body>
</html>
