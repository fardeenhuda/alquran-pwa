<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  font-family: "Scheherazade","Amiri",serif;
  padding:15px;
  line-height:2.2;
}
h1{text-align:center}
.surah{
  border-bottom:1px solid #ddd;
  padding:10px;
  font-size:20px;
  cursor:pointer;
}
.surah:hover{background:#f5f5f5}
.ayah{font-size:22px;margin:8px 0}
.num{color:#777;font-size:15px}
</style>
</head>
<body>

<h1>القرآن الكريم</h1>
<div id="surahList"></div>
<hr>
<div id="quran"></div>

<script>
fetch("quran.txt")
.then(r=>r.text())
.then(text=>{
  const lines=text.split("\n");
  const quran=document.getElementById("quran");
  const list=document.getElementById("surahList");

  let currentSurah=null;

  for(let line of lines){
    if(line.startsWith("# PLEASE DO NOT REMOVE")) break;
    if(!line.trim()) continue;

    const p=line.split("|");
    if(p.length<3) continue;

    const s=p[0], a=p[1], t=p[2];

    if(currentSurah!==s){
      currentSurah=s;

      // Surah container
      const container=document.createElement("div");
      container.id="surah-"+s;
      quran.appendChild(container);

      // Surah list item
      const sDiv=document.createElement("div");
      sDiv.className="surah";
      sDiv.textContent="سورة "+s;
      sDiv.onclick=()=>{
        document.getElementById("surah-"+s)
          .scrollIntoView({behavior:"smooth"});
      };
      list.appendChild(sDiv);
    }

    const ayah=document.createElement("div");
    ayah.className="ayah";
    ayah.innerHTML=`<span class="num">${s}|${a}</span> ${t}`;
    document.getElementById("surah-"+s).appendChild(ayah);
  }
});
</script>

</body>
</html>
