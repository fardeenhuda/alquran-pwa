<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: "Scheherazade New", serif;
  background: #fff;
  margin: 0;
  padding: 0;
}
h1 {
  text-align: center;
  padding: 16px;
}
ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
li {
  padding: 15px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
  text-align: right;
  font-size: 20px;
}
li:hover {
  background: #f5f5f5;
}
#content {
  padding: 16px;
  display: none;
}
.ayah {
  font-size: 22px;
  line-height: 2;
  text-align: right;
  margin-bottom: 10px;
}
.back {
  margin-bottom: 15px;
  display: inline-block;
  cursor: pointer;
  color: blue;
}
</style>
</head>

<body>

<h1 id="title">القرآن الكريم</h1>

<ul id="surahList"></ul>

<div id="content">
  <div class="back" onclick="showList()">← الرجوع</div>
  <div id="ayahs"></div>
</div>

<script>
fetch("quran.txt")
.then(res => res.text())
.then(text => {
  const lines = text.split("\n").filter(l => l.trim() && !l.startsWith("#"));
  const quran = {};

  lines.forEach(line => {
    const parts = line.split("|");
    if (parts.length >= 3) {
      const surah = parts[0].trim();
      const ayah = parts[1].trim();
      const text = parts.slice(2).join("|").trim();

      if (!quran[surah]) quran[surah] = [];
      quran[surah].push({ ayah, text });
    }
  });

  const list = document.getElementById("surahList");

  Object.keys(quran).forEach(surah => {
    const li = document.createElement("li");
    li.textContent = "سورة " + surah;
    li.onclick = () => openSurah(surah, quran[surah]);
    list.appendChild(li);
  });

  window.openSurah = function(surah, ayahs) {
    document.getElementById("surahList").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.getElementById("title").textContent = "سورة " + surah;

    const container = document.getElementById("ayahs");
    container.innerHTML = "";

    ayahs.forEach(a => {
      const div = document.createElement("div");
      div.className = "ayah";
      div.textContent = a.text;
      container.appendChild(div);
    });

    window.scrollTo(0,0);
  }

  window.showList = function() {
    document.getElementById("content").style.display = "none";
    document.getElementById("surahList").style.display = "block";
    document.getElementById("title").textContent = "القرآن الكريم";
    window.scrollTo(0,0);
  }
});
</script>

</body>
</html>
