<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 16px;
  font-family: 'Amiri Quran', serif;
  direction: rtl;
  text-align: right;
}

header {
  background: #1b8a3d;
  color: white;
  padding: 12px;
  font-size: 18px;
  text-align: center;
}

a.back {
  position: absolute;
  left: 10px;
  top: 12px;
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.ayah {
  font-size: 22px;
  line-height: 2.4;
}

.ayah-number {
  border: 1px solid black;
  border-radius: 50%;
  padding: 2px 7px;
  font-size: 14px;
  margin: 0 6px;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">← Back</a>
  القرآن الكريم
</header>

<div id="content"></div>

<script>
const surah = new URLSearchParams(window.location.search).get("s");

fetch("quran.txt")
  .then(res => res.text())
  .then(text => {
    const all = text.split(/(?=سُورَةُ)/g);
    const data = all[surah - 1];

    document.getElementById("content").innerHTML =
      data
        .replace(/\n/g, "<br>")
        .replace(/۝\s*(\d+)/g, ' <span class="ayah-number">$1</span>');
  });
</script>

</body>
</html>
