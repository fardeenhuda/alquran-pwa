<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 16px;
  font-family: 'Amiri Quran', serif;
  direction: rtl;
  text-align: right;
}

header {
  background: #1b8a3d;
  color: white;
  padding: 14px;
  font-size: 18px;
  text-align: center;
  position: sticky;
  top: 0;
}

.back {
  position: absolute;
  left: 12px;
  top: 14px;
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.ayah {
  font-size: 28px;   /* 👈 BIG & READABLE */
  line-height: 2.6;
}

.num {
  border: 1px solid #000;
  border-radius: 50%;
  padding: 2px 8px;
  font-size: 16px;
  margin: 0 6px;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">← Back</a>
  القرآن الكريم
</header>

<div id="content"></div>

<script>
const surahNo = Number(new URLSearchParams(location.search).get("s"));

fetch("quran.txt")
.then(r => r.text())
.then(text => {

  // each surah starts with "سورة"
  const surahs = text.split(/\n(?=سورة )/);
  let surahText = surahs[surahNo - 1];

  if (!surahText) {
    document.getElementById("content").innerHTML = "Surah not found";
    return;
  }

  // remove first line (surah title)
  surahText = surahText.split("\n").slice(1).join("\n");

  // remove bismillah if present
  surahText = surahText.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,"");

  // Arabic numbers
  const toArabic = n => n.replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

  let i = 1;
  surahText = surahText.replace(/\n/g, " ");
  surahText = surahText.replace(/۝/g, () => `<span class="num">${toArabic(String(i++))}</span>`);

  document.getElementById("content").innerHTML =
    `<div class="ayah">${surahText}</div>`;
});
</script>

</body>
</html>
