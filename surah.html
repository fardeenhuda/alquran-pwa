<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Qur'an</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  font-family: "Amiri Quran", serif;
  margin:0;
  padding:20px;
  direction:rtl;
  text-align:right;
}
header{
  background:#1e8e3e;
  color:#fff;
  padding:12px;
  text-align:center;
  font-size:18px;
}
.back{
  position:absolute;
  left:10px;
  top:12px;
  color:#fff;
  text-decoration:none;
}
.ayah{
  font-size:22px;
  line-height:2;
}
.num{
  display:inline-block;
  border:2px solid #000;
  border-radius:50%;
  width:28px;
  height:28px;
  line-height:26px;
  text-align:center;
  font-size:14px;
  margin:0 6px;
}
</style>
</head>
<body>

<header>
<a class="back" href="index.html">Back</a>
القرآن الكريم
</header>

<div id="content">Loading...</div>

<script>
const params = new URLSearchParams(location.search);
const surah = parseInt(params.get("surah"));

fetch("quran.txt")
.then(r=>r.text())
.then(text=>{
  const lines = text.split("\n");
  let out = "";
  let ayah = 1;

  lines.forEach(line=>{
    if(line.startsWith(surah+"|")){
      const parts = line.split("|");
      out += `<div class="ayah">${parts[2]} <span class="num">${ayah}</span></div>`;
      ayah++;
    }
  });

  document.getElementById("content").innerHTML = out || "No data";
});
</script>

</body>
</html>
