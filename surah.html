<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>سورة</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Amiri Quran', serif;
  margin: 0;
  padding: 15px;
  direction: rtl;
}

header {
  background: #1e9e5a;
  color: white;
  padding: 10px;
  display: flex;
  justify-content: space-between;
}

a { color:white; text-decoration:none; }

.ayah {
  font-size: 24px;
  line-height: 2.2;
  margin: 15px 0;
}

.circle {
  display:inline-flex;
  width:32px;
  height:32px;
  border:2px solid #1e9e5a;
  border-radius:50%;
  align-items:center;
  justify-content:center;
  font-size:16px;
  margin-right:8px;
}
</style>
</head>

<body>
<header>
<a href="index.html">← Back</a>
<div id="title"></div>
</header>

<div id="content"></div>

<script>
const params = new URLSearchParams(location.search);
const surahNo = params.get("no");
const surahName = params.get("name");

document.getElementById("title").innerText = surahName;

function toArabic(num){
  return num.toString().replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

fetch("quran.txt")
.then(r=>r.text())
.then(t=>{
  const lines = t.split("\n");
  const content = document.getElementById("content");
  let ayahNo=1;

  lines.forEach(l=>{
    const [s,a,text]=l.split("|");
    if(s==surahNo){
      content.innerHTML += `
        <div class="ayah">
          ${text}
          <span class="circle">${toArabic(ayahNo)}</span>
        </div>`;
      ayahNo++;
    }
  });
});
</script>
</body>
</html>
